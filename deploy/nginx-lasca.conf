# nginx για τη LASCA. Αντικατάστησε ΠΑΝΤΟΥ το lasca.example.com με το domain σου:
#   sed -i 's/lasca.example.com/το-domain-σου.gr/g' deploy/nginx-lasca.conf
# Το πιστοποιητικό HTTPS το παίρνεις ΠΡΙΝ ενεργοποιήσεις αυτό το αρχείο (βλ. deploy/README.md, βήμα 9):
#   sudo certbot certonly --nginx -d lasca.example.com -d www.lasca.example.com
#
# Ασφάλεια σε επίπεδο server (πρώτη γραμμή άμυνας, πριν φτάσει το αίτημα στην Python):
#   * Μόνο HTTPS: το http:// και το www ανακατευθύνονται πάντα στο https://lasca.example.com
#   * Όρια αιτημάτων ανά IP: γενικό, και πολύ αυστηρότερο για σύνδεση/εγγραφή/επαναφορά κωδικού
#   * Όριο ταυτόχρονων συνδέσεων ανά IP, κρυφά αρχεία (.git/.env) ποτέ

limit_req_zone $binary_remote_addr zone=lasca_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=lasca_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=lasca_conn:10m;

# http:// → https://
server {
    listen 80;
    listen [::]:80;
    server_name lasca.example.com www.lasca.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://lasca.example.com$request_uri; }
}

# https://www → https:// (χωρίς www)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.lasca.example.com;
    ssl_certificate /etc/letsencrypt/live/lasca.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lasca.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://lasca.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lasca.example.com;

    ssl_certificate /etc/letsencrypt/live/lasca.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lasca.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    server_tokens off;
    client_max_body_size 10M;
    client_body_timeout 30s;
    limit_conn lasca_conn 30;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~ ^/api/(login|register|auth/) {
        limit_req zone=lasca_auth burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/lasca-proxy.conf;
    }

    location /api/ {
        limit_req zone=lasca_api burst=40 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/lasca-proxy.conf;
    }

    location /assets/ {
        include /etc/nginx/snippets/lasca-proxy.conf;
        expires 1y;
    }

    location ~ /\. { deny all; return 404; }

    location / {
        include /etc/nginx/snippets/lasca-proxy.conf;
    }
}

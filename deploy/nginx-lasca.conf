# nginx: δέχεται τις επισκέψεις στο domain σου και τις περνάει στη LASCA (gunicorn, θύρα 8000).
# Άλλαξε το lasca.example.com στο δικό σου domain.
# Αντιγραφή:  sudo cp deploy/nginx-lasca.conf /etc/nginx/sites-available/lasca
server {
    listen 80;
    server_name lasca.example.com www.lasca.example.com;

    # Μέγιστο μέγεθος upload (Excel, εικόνες προφίλ, screenshots)
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

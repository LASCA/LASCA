# nginx: δέχεται τις επισκέψεις στο domain σου και τις περνάει στη LASCA (gunicorn, θύρα 8000).
# Άλλαξε το lasca.example.com στο δικό σου domain.
#   sudo cp deploy/nginx-lasca.conf /etc/nginx/sites-available/lasca
#   sudo cp deploy/lasca-proxy.conf /etc/nginx/snippets/lasca-proxy.conf
#   sudo certbot --nginx -d lasca.example.com     (βάζει τα πιστοποιητικά HTTPS)
#
# Ασφάλεια σε επίπεδο server (πρώτη γραμμή άμυνας, πριν φτάσει το αίτημα στην Python):
#   * Μόνο HTTPS: το http:// ανακατευθύνεται πάντα στο https://
#   * Όρια αιτημάτων ανά IP: γενικό, και πολύ αυστηρότερο για σύνδεση/εγγραφή/επαναφορά κωδικού
#   * Όριο ταυτόχρονων συνδέσεων ανά IP, κρυφά αρχεία (.git/.env) ποτέ

limit_req_zone $binary_remote_addr zone=lasca_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=lasca_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=lasca_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name lasca.example.com www.lasca.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://lasca.example.com$request_uri; }
}

server {
    # Τις γραμμές «listen 443 ssl» και ssl_certificate τις προσθέτει το certbot.
    server_name lasca.example.com;

    server_tokens off;
    client_max_body_size 10M;
    client_body_timeout 30s;
    limit_conn lasca_conn 30;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~ ^/api/(login|register|auth/) {
        limit_req zone=lasca_auth burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/lasca-proxy.conf;
    }

    location /api/ {
        limit_req zone=lasca_api burst=40 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/lasca-proxy.conf;
    }

    location /assets/ {
        include /etc/nginx/snippets/lasca-proxy.conf;
        expires 1y;
    }

    location ~ /\. { deny all; return 404; }

    location / {
        include /etc/nginx/snippets/lasca-proxy.conf;
    }
}
